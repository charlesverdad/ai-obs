[package]
name = "ai-obs"
version = "0.1.0"
edition = "2021"
description = "Local-first observability for AI coding agents: CPU, memory, tokens and cost per tool call, grouped by project."
license = "MIT"
repository = "https://github.com/charlesverdad/ai-obs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
ratatui = "0.29"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
